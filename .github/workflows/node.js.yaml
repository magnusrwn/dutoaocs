name: Node.js CI Build/test

on:
    pull_request: 
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [26.x]
        
        steps:
          - uses: actions/checkout@v4
            
          - name: Use Node.js ${{matrix.node-version}}
            uses: actions/setup-node@v4
            with:
                node-version: ${{matrix.node-version}}

          - run: npm run clean
          - run: npm ci
          - run: npm run prepack
          - run: npm test